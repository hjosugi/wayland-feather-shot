name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python -m compileall -q src

      - name: Run the (GTK-free) unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check the shipped ja.mo is in sync with the source table
        run: |
          python scripts/gen-po.py
          git diff --exit-code -- src/wayland_feather_shot/locale po \
            || (echo "::error::po/ or ja.mo out of date — run scripts/gen-po.py" && exit 1)

  gtk-rendering:
    runs-on: ubuntu-latest
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 xvfb dbus-x11

      - name: Run the overlay rendering regressions
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 - <<'PY'
          import sys
          import unittest
          import cairo
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Gdk", "4.0")
          from gi.repository import Gdk, Gtk
          Gtk.init()
          if Gdk.Display.get_default() is None:
              raise RuntimeError("The GTK rendering tests require a display")
          suite = unittest.defaultTestLoader.discover(
              "tests", pattern="test_overlay_rendering.py",
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
